<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Season 1 Bracket — Boolin League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Saira+Extra+Condensed:ital,wght@1,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

</head>
<body>

  <div class="wave-bg" aria-hidden="true">
    <!-- SVG wave layers -->
    <svg class="wave-svg" viewBox="0 0 1440 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,100 C180,20 360,180 540,100 C720,20 900,180 1080,100 C1260,20 1350,140 1440,100 L1440,200 L0,200Z" fill="#7c3aed"/>
    </svg>
    <svg class="wave-svg-mid" viewBox="0 0 1440 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,80 C240,10 480,150 720,80 C960,10 1200,150 1440,80 L1440,160 L0,160Z" fill="#4c1d95"/>
    </svg>
    <svg class="wave-svg-top" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C120,10 240,110 360,60 C480,10 600,110 720,60 C840,10 960,110 1080,60 C1200,10 1320,110 1440,60 L1440,120 L0,120Z" fill="#7c3aed"/>
    </svg>

    <!-- Waveform bars visualizer -->
    <div class="waveform-bars" aria-hidden="true">
      <span style="--dur:1.2s;height:30%"></span><span style="--dur:2.1s;height:60%"></span>
      <span style="--dur:1.7s;height:40%"></span><span style="--dur:0.9s;height:80%"></span>
      <span style="--dur:2.4s;height:50%"></span><span style="--dur:1.4s;height:90%"></span>
      <span style="--dur:1.9s;height:35%"></span><span style="--dur:2.7s;height:70%"></span>
      <span style="--dur:1.1s;height:55%"></span><span style="--dur:2.0s;height:45%"></span>
      <span style="--dur:1.6s;height:85%"></span><span style="--dur:0.8s;height:40%"></span>
      <span style="--dur:2.2s;height:65%"></span><span style="--dur:1.5s;height:30%"></span>
      <span style="--dur:1.8s;height:75%"></span><span style="--dur:2.5s;height:50%"></span>
      <span style="--dur:1.3s;height:95%"></span><span style="--dur:2.8s;height:40%"></span>
      <span style="--dur:1.0s;height:60%"></span><span style="--dur:2.3s;height:80%"></span>
      <span style="--dur:1.7s;height:45%"></span><span style="--dur:0.9s;height:70%"></span>
      <span style="--dur:2.1s;height:55%"></span><span style="--dur:1.4s;height:35%"></span>
      <span style="--dur:1.9s;height:90%"></span><span style="--dur:2.6s;height:60%"></span>
      <span style="--dur:1.2s;height:40%"></span><span style="--dur:2.0s;height:75%"></span>
      <span style="--dur:1.6s;height:50%"></span><span style="--dur:0.7s;height:85%"></span>
      <span style="--dur:2.4s;height:30%"></span><span style="--dur:1.5s;height:65%"></span>
      <span style="--dur:1.1s;height:45%"></span><span style="--dur:2.2s;height:95%"></span>
      <span style="--dur:1.8s;height:55%"></span><span style="--dur:2.7s;height:40%"></span>
      <span style="--dur:1.3s;height:70%"></span><span style="--dur:2.0s;height:80%"></span>
    </div>
  </div>

  <!-- ══ NAV ══ -->
  <nav class="nav" role="navigation" aria-label="Main navigation">

    <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu" onclick="toggleMobileMenu()">
      <span></span>
      <span></span>
    </button>

    <div class="nav-links">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link active" href="/league" aria-current="page">Boolin League</a>
      <a class="nav-link" href="/shop">Shop</a>
      <a class="nav-link" href="/coaching">Coaching</a>
      <a class="nav-link" href="/contact">Contact</a>
    </div>

    <div id="nav-auth" style="display:flex;align-items:center;gap:0.75rem;">
      <!-- populated by initAuth() -->
    </div>

  </nav>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <a class="mobile-menu-link" href="/">Home</a>
    <a class="mobile-menu-link" href="/league">Boolin League</a>
    <a class="mobile-menu-link" href="/shop">Shop</a>
    <a class="mobile-menu-link" href="/coaching">Coaching</a>
    <a class="mobile-menu-link" href="/contact">Contact</a>
  </div>

  <div class="page" id="page-s1bracket">
    <div style="min-height:100vh;background:#07030f;padding:0 0 6rem;">

      <div style="padding:1.5rem 2rem 0;max-width:1100px;margin:0 auto;">
        <button onclick="location.href='/schedule'" style="display:inline-flex;align-items:center;gap:0.5rem;background:none;border:none;color:rgba(255,255,255,0.5);font-size:0.8rem;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;padding:0.5rem 0;transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.5)'">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Season 1
        </button>
      </div>

      <div style="text-align:center;padding:2.5rem 2rem 1rem;">
        <div style="font-family:'Rajdhani',sans-serif;font-size:0.72rem;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--purple-glow);margin-bottom:0.5rem;">Boolin League · Season 1</div>
        <h1 style="font-family:'Rajdhani',sans-serif;font-size:clamp(2.2rem,6vw,3.8rem);font-weight:900;letter-spacing:-0.01em;line-height:1;color:#fff;text-shadow:0 0 40px rgba(124,58,237,0.4);">SEASON 1 BRACKET</h1>
      </div>

      <div id="s1b-champion-banner" style="display:none;text-align:center;margin:0.5rem auto 1.5rem;max-width:400px;">
        <div style="display:inline-flex;align-items:center;gap:0.6rem;background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.4);border-radius:24px;padding:0.5rem 1.25rem;">
          <span style="font-size:1.1rem;">🏆</span>
          <span id="s1b-champion-name" style="font-family:'Rajdhani',sans-serif;font-weight:900;font-size:1.05rem;color:#fbbf24;letter-spacing:0.05em;"></span>
        </div>
      </div>

      <!-- Bracket -->
      <div id="s1b-bracket" style="max-width:1100px;margin:0 auto;padding:1rem 1.5rem;overflow-x:auto;">
        <div style="min-width:700px;">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0;align-items:center;">

            <!-- QF Column -->
            <div id="s1b-qf" style="display:flex;flex-direction:column;gap:0;padding-right:0;">
              <div style="font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;color:rgba(124,58,237,0.55);text-align:center;margin-bottom:1rem;font-family:'Rajdhani',sans-serif;font-weight:700;">Quarterfinals</div>
              <div style="display:flex;flex-direction:column;gap:2.5rem;" id="s1b-qf-matches"></div>
            </div>

            <!-- SF Column -->
            <div id="s1b-sf" style="display:flex;flex-direction:column;gap:0;padding:0 1rem;">
              <div style="font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;color:rgba(124,58,237,0.55);text-align:center;margin-bottom:1rem;font-family:'Rajdhani',sans-serif;font-weight:700;">Semifinals</div>
              <div style="display:flex;flex-direction:column;gap:0;justify-content:space-around;height:100%;" id="s1b-sf-matches"></div>
            </div>

            <!-- Final Column -->
            <div style="display:flex;flex-direction:column;align-items:center;">
              <div style="font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;color:rgba(124,58,237,0.55);text-align:center;margin-bottom:1rem;font-family:'Rajdhani',sans-serif;font-weight:700;">Final</div>
              <div id="s1b-final-match"></div>
            </div>

            <!-- Winner Column -->
            <div style="display:flex;flex-direction:column;align-items:center;padding-left:1rem;">
              <div style="font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;color:rgba(251,191,36,0.7);text-align:center;margin-bottom:1rem;font-family:'Rajdhani',sans-serif;font-weight:700;">Winner</div>
              <div style="background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.3);border-radius:8px;padding:0.875rem 1.25rem;min-width:140px;text-align:center;">
                <span style="font-size:1.1rem;">🏆</span>
                <div id="s1b-winner-name" style="font-family:'Rajdhani',sans-serif;font-weight:900;font-size:0.95rem;color:rgba(255,255,255,0.35);letter-spacing:0.04em;margin-top:0.4rem;">TBD</div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <p id="s1b-empty" style="text-align:center;color:rgba(255,255,255,0.25);font-family:'Rajdhani',sans-serif;font-size:0.9rem;margin-top:3rem;display:none;">Bracket seeds not set yet. Check back soon.</p>
    </div>
  </div><!-- /page-s1bracket -->

  <script src="/assets/common.js"></script>
  <script>
    function makeBracketCard(m) {
      var t1 = m.team1 || 'TBD'; var t2 = m.team2 || 'TBD';
      var w = m.winner;
      function teamHtml(name) {
        var isWinner = w && w === name;
        var isLoser  = w && w !== name && name !== 'TBD';
        var col = isWinner ? '#fff' : isLoser ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.55)';
        var weight = isWinner ? '900' : '600';
        var glow = isWinner ? 'text-shadow:0 0 12px rgba(167,139,250,0.6);' : '';
        return '<div style="padding:0.5rem 0.875rem;font-family:\'Rajdhani\',sans-serif;font-size:0.95rem;font-weight:' + weight + ';color:' + col + ';letter-spacing:0.03em;' + glow + (isWinner ? 'background:rgba(124,58,237,0.12);' : '') + '">' + name.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>';
      }
      return '<div style="background:rgba(17,10,42,0.85);border:1px solid rgba(124,58,237,' + (w ? '0.45' : '0.2') + ');border-radius:8px;overflow:hidden;min-width:160px;">'
        + teamHtml(t1)
        + '<div style="height:1px;background:rgba(124,58,237,0.15);"></div>'
        + teamHtml(t2)
        + '</div>';
    }

    function loadS1Bracket() {
      fetch('/api/bracket/s1').then(function(r){return r.json();}).then(function(b) {
        var anyTeam = b.qf.some(function(m){ return m.team1 || m.team2; });
        document.getElementById('s1b-empty').style.display = anyTeam ? 'none' : 'block';
        document.getElementById('s1b-bracket').style.display = anyTeam ? 'block' : 'none';

        // QF
        document.getElementById('s1b-qf-matches').innerHTML = b.qf.map(function(m){
          return '<div>' + makeBracketCard(m) + '</div>';
        }).join('');

        // SF — vertically center between their QF pairs
        document.getElementById('s1b-sf-matches').innerHTML = b.sf.map(function(m){
          return '<div style="margin:1.25rem 0;">' + makeBracketCard(m) + '</div>';
        }).join('');

        // Final
        document.getElementById('s1b-final-match').innerHTML = makeBracketCard(b.final);

        // Champion banner
        if (b.final.winner) {
          document.getElementById('s1b-champion-name').textContent = b.final.winner;
          document.getElementById('s1b-champion-banner').style.display = 'block';
        } else {
          document.getElementById('s1b-champion-banner').style.display = 'none';
        }

        // Winner column
        var winnerEl = document.getElementById('s1b-winner-name');
        if (b.final.winner) {
          winnerEl.textContent = b.final.winner;
          winnerEl.style.color = '#fbbf24';
        } else {
          winnerEl.textContent = 'TBD';
          winnerEl.style.color = 'rgba(255,255,255,0.35)';
        }
      }).catch(function(){});
    }

loadS1Bracket();
  </script>
</body>
</html>
