    function getRankClass(rank) {
      if (rank === 1) return 'rank-1';
      if (rank === 2) return 'rank-2';
      if (rank === 3) return 'rank-3';
      return 'rank-other';
    }

    function getRankLabel(rank) {
      if (rank === 1) return '🥇';
      if (rank === 2) return '🥈';
      if (rank === 3) return '🥉';
      return rank;
    }

    function buildLeaderboard() {
      const tbody = document.getElementById('lb-body');
      tbody.innerHTML = '';
      players.forEach((p, i) => {
        const rank = i + 1;
        const isTop3 = rank <= 3;
        const isTbd = p.tbd;
        const isUnknown = p.unknown;
        const tr = document.createElement('tr');
        tr.className = 'lb-row' + (isTop3 ? ' top-3' : '');

        const silSvg = `<svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="currentColor"/></svg>`;
        const avatarHtml = (isUnknown || isTbd)
          ? `<div style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.05);border:2px dashed rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:rgba(255,255,255,0.2);">${silSvg}</div>`
          : `<div style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:rgba(255,255,255,0.65);">${silSvg}</div>`;

        const trophies = (!isUnknown && !isTbd && p.wins > 0) ? ' ' + '🏆'.repeat(p.wins) : '';
        const nameHtml = isUnknown
          ? `<div class="lb-name" style="color:rgba(255,255,255,0.2);letter-spacing:0.1em;">— TBD —</div>`
          : `<div class="lb-name" style="${isTbd ? 'color:rgba(255,255,255,0.55);' : ''}">${p.name}${trophies}</div>`;

        const winsHtml = isTbd
          ? `<span class="lb-wins" style="color:rgba(255,255,255,0.25);font-size:0.85rem;">TBD</span>`
          : `<span class="lb-wins">${p.wins}</span>`;

        const ptsHtml = isTbd
          ? `<span class="lb-points" style="color:rgba(255,255,255,0.25);font-size:0.85rem;">TBD</span>`
          : `<span class="lb-points">${p.points.toLocaleString()}</span>`;

        const chevronHtml = (!isTbd)
          ? `<svg class="lb-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
          : '';

        tr.innerHTML = `
          <td><span class="lb-rank ${getRankClass(rank)}">${getRankLabel(rank)}</span></td>
          <td>${avatarHtml}</td>
          <td>${nameHtml}</td>
          <td>${winsHtml}</td>
          <td>${ptsHtml}</td>
          <td>${chevronHtml}</td>
        `;

        if (!isTbd) {
          tr.tabIndex = 0;
          tr.setAttribute('role', 'button');
          tr.setAttribute('aria-label', `View ${p.name} profile, rank ${rank}`);
          tr.addEventListener('click', () => openPlayerModal(p, rank));
          tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlayerModal(p, rank); } });
        } else {
          tr.style.cursor = 'default';
          tr.style.opacity = isUnknown ? '0.35' : '0.6';
        }

        tbody.appendChild(tr);
      });
    }

    function getPlacementClass(place) {
      if (place === 1) return 'placement-1';
      if (place === 2) return 'placement-2';
      if (place === 3) return 'placement-3';
      return 'placement-other';
    }

    function getPlacementLabel(place) {
      if (place === 1) return '1st';
      if (place === 2) return '2nd';
      if (place === 3) return '3rd';
      if (place === 5) return '5/8th';
      if (place === 7) return '6th-8th';
      return place + 'th';
    }

    function openPlayerModal(player, rank) {
      document.getElementById('modal-avatar').innerHTML = `<svg viewBox="0 0 24 24" width="30" height="30"><circle cx="12" cy="8" r="4" fill="rgba(255,255,255,0.75)"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="rgba(255,255,255,0.75)"/></svg>`;
      document.getElementById('modal-player-name').textContent = player.name;
      document.getElementById('modal-player-tag').textContent = player.tag;
      document.getElementById('modal-rank').textContent = '#' + rank;
      document.getElementById('modal-wins').textContent = player.wins;
      document.getElementById('modal-points').textContent = player.points.toLocaleString();

      const histEl = document.getElementById('modal-history');
      histEl.innerHTML = player.history.map(h => `
        <div class="tourney-result">
          <div class="placement-badge ${getPlacementClass(h.place)}">${getPlacementLabel(h.place)}</div>
          <div>
            <div class="result-tourney-name">${h.name}</div>
            <div class="result-date">${h.date}</div>
          </div>
          <div class="result-points">${h.pts > 0 ? '+' + h.pts + ' pts' : '—'}</div>
        </div>
      `).join('');

      const overlay = document.getElementById('playerModal');
      overlay.style.display = 'flex';
      requestAnimationFrame(() => overlay.classList.add('open'));
      document.body.style.overflow = 'hidden';

      // Focus trap
      setTimeout(() => {
        const closeBtn = overlay.querySelector('.modal-close');
        if (closeBtn) closeBtn.focus();
      }, 50);
    }

    function closePlayerModal(force) {
      if (force === true || (force && force.target === document.getElementById('playerModal'))) {
        const overlay = document.getElementById('playerModal');
        overlay.classList.remove('open');
        overlay.style.display = 'none';
        document.body.style.overflow = '';
      }
    }

    buildLeaderboard();
  </script>
</body>
</html>
